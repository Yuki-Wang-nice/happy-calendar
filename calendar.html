<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>九月 · 每日幸福小事日历</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, -apple-system, sans-serif;}
body{background:#fff8ef;padding:16px;color:#5c4b3e;}
.wrapper{max-width:720px;margin:0 auto;}
header{text-align:center;margin-bottom:20px;}
h1{font-size:24px;margin-bottom:8px;}
.desc{font-size:15px;color:#8c7360;line-height:1.6;}
.btns{text-align:center;margin-bottom:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
button{padding:8px 14px;border-radius:99px;border:none;font-size:14px;cursor:pointer;}
#exportBtn{background:#d4b89b;color:#fff;}
#clearBtn{background:#eee;color:#666;}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;}
.week-title{text-align:center;font-size:14px;padding:6px 4px;font-weight:bold;color:#8c7360;}
.day-card{background:#fff;border-radius:14px;padding:10px;min-height:100px;border:1px solid #ede2d4;box-shadow:0 2px 6px #00000008;transition:0.2s;position:relative;}
.day-card:hover{transform:translateY(-2px);box-shadow:0 4px 10px #00000012;}
.day-card.weekend{background:#fff4e8;}
.day-card.today{background:#ffeeda;border:1px solid #e6c298;}
.today-tag{position:absolute;top:4px;right:6px;background:#d48b58;color:#fff;font-size:11px;padding:2px 5px;border-radius:6px;}
.date-num{font-weight:bold;margin-bottom:6px;font-size:15px;}
textarea{width:100%;border:none;outline:none;background:transparent;font-size:13px;resize:none;height:58px;color:#5c4b3e;}
textarea::placeholder{color:#c2b2a2;}
footer{text-align:center;margin-top:28px;padding-top:16px;color:#8c7360;font-size:14px;line-height:1.7;}
</style>
</head>
<body>
<div class="wrapper">
<header>
<h1>九月 · 每日幸福小事</h1>
<p class="desc">把平凡日子里微小的温柔一一记录，月末回看，收获一整月的温暖。</p>
</header>
<div class="btns">
<button id="exportBtn">📷 导出日历图片</button>
<button id="clearBtn">🗑️ 清空全部记录</button>
</div>
<div id="capture-area" class="calendar">
  <div class="week-title">周一</div>
  <div class="week-title">周二</div>
  <div class="week-title">周三</div>
  <div class="week-title">周四</div>
  <div class="week-title">周五</div>
  <div class="week-title">周六</div>
  <div class="week-title">周日</div>
  <!-- 9月1日是周二 -->
  <div></div>
  <div class="day-card"><div class="date-num">9.1</div><textarea data-key="day1" placeholder="写下今日的小幸福"></textarea></div>
  <div class="day-card"><div class="date-num">9.2</div><textarea data-key="day2" placeholder="写下今日的小幸福"></textarea></div>
  <div class="day-card"><div class="date-num">9.3</div><textarea data-key="day3" placeholder="写下今日的小幸福"></textarea></div>
  <div class="day-card"><div class="date-num">9.4</div><textarea data-key="day4" placeholder="写下今日的小幸福"></textarea></div>
  <div class="day-card weekend"><div class="date-num">9.5</div><textarea data-key="day5" placeholder="写下今日的小幸福"></textarea></div>
  <div class="day-card weekend"><div class="date-num">9.6</div><textarea data-key="day6" placeholder="写下今日的小幸福"></textarea></div>

  <div class="day-card"><div class="date-num">9.7</div><textarea data-key="day7" placeholder="写下今日的小幸福"></textarea></div>
  <div class="day-card"><div class="date-num">9.8</div><textarea data-key="day8" placeholder="写下今日的小幸福"></textarea></div>
  <div class="day-card"><div class="date-num">9.9</div><textarea data-key="day9" placeholder="写下今日的小幸福"></textarea></div>
  <div class="day-card"><div class="date-num">9.10</div><textarea data-key="day10" placeholder="写下今日的小幸福"></textarea></div>
  <div class="day-card"><div class="date-num">9.11</div><textarea data-key="day11" placeholder="写下今日的小幸福"></textarea></div>
  <div class="day-card weekend"><div class="date-num">9.12</div><textarea data-key="day12" placeholder="写下今日的小幸福"></textarea></div>
  <div class="day-card weekend"><div class="date-num">9.13</div><textarea data-key="day13" placeholder="写下今日的小幸福"></textarea></div>

  <div class="day-card today"><span class="today-tag">今天</span><div class="date-num">9.14</div><textarea data-key="day14" placeholder="写下今日的小幸福"></textarea></div>
  <div class="day-card"><div class="date-num">9.15</div><textarea data-key="day15" placeholder="写下今日的小幸福"></textarea></div>
  <div class="day-card"><div class="date-num">9.16</div><textarea data-key="day16" placeholder="写下今日的小幸福"></textarea></div>
  <div class="day-card"><div class="date-num">9.17</div><textarea data-key="day17" placeholder="写下今日的小幸福"></textarea></div>
  <div class="day-card"><div class="date-num">9.18</div><textarea data-key="day18" placeholder="写下今日的小幸福"></textarea></div>
  <div class="day-card weekend"><div class="date-num">9.19</div><textarea data-key="day19" placeholder="写下今日的小幸福"></textarea></div>
  <div class="day-card weekend"><div class="date-num">9.20</div><textarea data-key="day20" placeholder="写下今日的小幸福"></textarea></div>

  <div class="day-card"><div class="date-num">9.21</div><textarea data-key="day21" placeholder="写下今日的小幸福"></textarea></div>
  <div class="day-card"><div class="date-num">9.22</div><textarea data-key="day22" placeholder="写下今日的小幸福"></textarea></div>
  <div class="day-card"><div class="date-num">9.23</div><textarea data-key="day23" placeholder="写下今日的小幸福"></textarea></div>
  <div class="day-card"><div class="date-num">9.24</div><textarea data-key="day24" placeholder="写下今日的小幸福"></textarea></div>
  <div class="day-card"><div class="date-num">9.25</div><textarea data-key="day25" placeholder="写下今日的小幸福"></textarea></div>
  <div class="day-card weekend"><div class="date-num">9.26</div><textarea data-key="day26" placeholder="写下今日的小幸福"></textarea></div>
  <div class="day-card weekend"><div class="date-num">9.27</div><textarea data-key="day27" placeholder="写下今日的小幸福"></textarea></div>

  <div class="day-card"><div class="date-num">9.28</div><textarea data-key="day28" placeholder="写下今日的小幸福"></textarea></div>
  <div class="day-card"><div class="date-num">9.29</div><textarea data-key="day29" placeholder="写下今日的小幸福"></textarea></div>
  <div class="day-card"><div class="date-num">9.30</div><textarea data-key="day30" placeholder="写下今日的小幸福"></textarea></div>
  <div></div><div></div><div></div>
</div>
<footer>
<p>💡 记录保存在你的浏览器本地，清理缓存会丢失记录，记得截图留存美好。</p>
<p>九月将尽，愿你收集满一整月的小确幸。</p>
</footer>
</div>
<script>
//读取本地存储
const items = document.querySelectorAll('textarea[data-key]');
items.forEach(ta=>{
  const key = ta.dataset.key;
  const saved = localStorage.getItem(key);
  if(saved) ta.value = saved;
  ta.addEventListener('input',()=>{
    localStorage.setItem(key, ta.value);
  })
})

//导出图片
document.getElementById('exportBtn').onclick = async function(){
  const dom = document.getElementById('capture-area');
  html2canvas(dom,{scale:2,backgroundColor:'#fff8ef'}).then(canvas=>{
    const a = document.createElement('a');
    a.download = "九月幸福日历.png";
    a.href = canvas.toDataURL("image/png");
    a.click();
  })
}

//清空全部
document.getElementById('clearBtn').onclick = function(){
  if(confirm("确定要清空本月所有记录吗？无法恢复！")){
    items.forEach(ta=>{
      localStorage.removeItem(ta.dataset.key);
      ta.value = '';
    })
  }
}
</script>
</body>
</html>
